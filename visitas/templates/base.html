<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Visitas{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "SF Pro Display", "SF Pro Text", ui-sans-serif, system-ui, sans-serif;
        }

        @layer base {
            body {
                @apply min-h-screen font-sans text-slate-800 antialiased;
                background-image:
                    linear-gradient(135deg, #dce3ea 0%, #eef1f4 52%, #d4dde5 100%);
                background-attachment: fixed;
            }
        }
    </style>
</head>

<body class="selection:bg-teal-100 selection:text-slate-950">
    <a href="#contenido" class="sr-only z-50 rounded-lg bg-[#102a43] px-4 py-3 font-semibold text-white focus:not-sr-only focus:absolute focus:left-4 focus:top-4">Saltar al contenido</a>
    <header class="px-4 pt-4 sm:px-6 sm:pt-6">
        <nav aria-label="Navegacion principal" class="mx-auto flex max-w-6xl items-center justify-between rounded-none border border-[#9aa6b2] bg-white px-3 py-3 shadow-[0_8px_24px_rgba(16,42,67,0.12)] sm:px-4">
            <a href="{% url 'visitas_list' %}" class="flex items-center gap-3 rounded-lg px-2 py-1.5 font-semibold tracking-tight text-[#102a43] transition hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
                <span class="flex size-9 items-center justify-center rounded-lg bg-[#102a43] text-white shadow-sm" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.07a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6.27A2.25 2.25 0 0 1 6 4.02h4.08M15.75 3.52H20.5m0 0v4.75m0-4.75L12 12.02" /></svg>
                </span>
                <span>Visitas</span>
            </a>
            <div class="flex items-center gap-1 sm:gap-2">
                <a href="{% url 'visitas_list' %}" class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-[#102a43] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3.75h19.5v16.5H2.25V3.75ZM2.25 9h19.5M8.25 9v11.25" /></svg>
                    <span class="hidden sm:inline">Visitas</span>
                    <span class="sr-only sm:hidden">Visitas</span>
                </a>
                <a href="{% url 'visitas_create' %}" class="inline-flex items-center gap-2 rounded-lg bg-[#5b7083] px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-[#4b6072] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-5" aria-hidden="true"><path stroke-linecap="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    <span class="hidden sm:inline">Nueva visita</span>
                    <span class="sr-only sm:hidden">Nueva visita</span>
                </a>
            </div>
        </nav>
    </header>
    <main id="contenido" class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
